[project]
name = "speakit"
version = "0.1.0"
description = "System-wide push-to-toggle voice-to-text for Hyprland. Types transcription into the active window."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "onnx-asr[hub]>=0.12",
    # [cuda,cudnn] pull self-contained CUDA 13 + cuDNN 9 wheels; the daemon
    # loads them via onnxruntime.preload_dlls(), so no system CUDA needed.
    "onnxruntime-gpu[cuda,cudnn]>=1.32",
]

[project.scripts]
speakitd = "speakit.daemon:main"
speakit-toggle = "speakit.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speakit"]
